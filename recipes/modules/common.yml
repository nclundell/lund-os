# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  # RPM Fusion
  - type: dnf
    repos:
      nonfree: rpmfusion
      cleanup: true
    install:
      packages:
        - lame
        - mpd
        - mpdris2
        - ncmpcpp

  # Build Deps
  - type: dnf
    install:
      packages:
        - autoconf
        - bzip2
        - gcc
        - gcc-c++
        - make
        - patch
        - perl-FindBin
        - pkgconf-pkg-config
        - rust
        - gdbm-devel
        - glibc-devel
        - libffi-devel
        - libyaml-devel
        - ncurses-devel
        - openssl-devel
        - readline-devel
        - zlib-ng-compat-devel

  - type: dnf
    install:
      packages:
        - abcde
        - cabextract
        - cd-discid
        - curl
        - ddrescue
        - file
        - flac
        - git
        - ImageMagick
        - libcdio-paranoia
        - libdiscid
        - libldac
        - mkvtoolnix
        - opus-tools
        - p7zip
        - papirus-icon-theme
        - procps-ng
        - steam-devices
        - unrar
        - unzip
        - vorbis-tools
        - yaru-icon-theme
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - scope: system
        notify: false
        repo:
          title: Flathub
        install:
          - com.brave.Browser                    # Brave Browser
          - io.github.celluloid_player.Celluloid # Celluloid
          - com.ranfdev.DistroShelf              # DistroShelf
          - com.github.tchx84.Flatseal           # Flatseal
          - io.github.flattool.Warehouse         # Warehouse
